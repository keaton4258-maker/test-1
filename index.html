<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Real-Asset Console</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #050505; color: #39FF14; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .header { text-align: center; border-bottom: 1px solid #323232; padding-bottom: 15px; margin-bottom: 20px; }
        #clock { font-size: 1.2rem; opacity: 0.7; }
        #btc-jpy { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
        .chart-container { background: #111; border-radius: 8px; padding: 10px; margin-bottom: 20px; height: 200px; }
        .stock-list { border-top: 1px solid #323232; padding-top: 10px; }
        .stock-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dotted #222; text-decoration: none; color: inherit; }
        .sync-btn { background: #39FF14; color: #000; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <div id="clock">00:00:00</div>
    <div id="btc-jpy">Loading...</div>
</div>

<div class="chart-container">
    <canvas id="btcChart"></canvas>
</div>

<div class="stock-list">
    <a href="https://www.google.com/finance/quote/3350:TYO" class="stock-item">
        <span>Metaplanet (3350)</span><span>Go to Chart ↗</span>
    </a>
    <a href="https://www.google.com/finance/quote/IBIT:NASDAQ" class="stock-item">
        <span>iShares BTC (IBIT)</span><span>Check ↗</span>
    </a>
</div>

<button class="sync-btn" onclick="updateAll()">SYNC REAL DATA</button>

<script>
    let chart;

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('ja-JP');
    }
    setInterval(updateClock, 1000);

    async function updateAll() {
        if (navigator.vibrate) navigator.vibrate(50);
        
        // 1. BTC 現在価格 (JPY)
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy');
            const data = await res.json();
            document.getElementById('btc-jpy').innerText = `¥${data.bitcoin.jpy.toLocaleString()}`;
        } catch(e) { document.getElementById('btc-jpy').innerText = "API Limit Over"; }

        // 2. BTC 1年間の推移データ取得
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=jpy&days=365&interval=daily');
            const data = await res.json();
            const prices = data.prices.map(p => p[1]);
            const labels = data.prices.map(p => ""); // ラベルは省略

            if (chart) chart.destroy();
            const ctx = document.getElementById('btcChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: prices,
                        borderColor: '#39FF14',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { display: false }, y: { grid: { color: '#222' }, ticks: { color: '#39FF14', font: { size: 10 } } } },
                    plugins: { legend: { display: false } }
                }
            });
        } catch(e) { console.error("Chart error"); }
    }

    updateClock();
    updateAll();
</script>

</body>
</html>
